<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" fill="none">
  <!-- Vending Machine Cabinet -->
  <rect x="28" y="14" width="124" height="186" rx="14" fill="#261A66" stroke="#191047" stroke-width="4"/>
  <rect x="36" y="22" width="108" height="170" rx="10" fill="#322380"/>
  <!-- Glass Display Window -->
  <rect x="44" y="30" width="68" height="114" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#EF5F18" stroke-width="2.5"/>
  <!-- Shelf 1 -->
  <line x1="46" y1="66" x2="110" y2="66" stroke="#261A66" stroke-width="2.5"/>
  <rect x="52" y="42" width="14" height="21" rx="3" fill="#EF5F18"/>
  <rect x="71" y="42" width="14" height="21" rx="3" fill="#261A66"/>
  <rect x="90" y="42" width="14" height="21" rx="3" fill="#EF5F18"/>
  <!-- Shelf 2 -->
  <line x1="46" y1="102" x2="110" y2="102" stroke="#261A66" stroke-width="2.5"/>
  <rect x="52" y="76" width="14" height="23" rx="4" fill="#3B82F6"/>
  <rect x="71" y="76" width="14" height="23" rx="4" fill="#EF5F18"/>
  <rect x="90" y="76" width="14" height="23" rx="4" fill="#10B981"/>
  <!-- Shelf 3 -->
  <line x1="46" y1="138" x2="110" y2="138" stroke="#261A66" stroke-width="2.5"/>
  <rect x="52" y="112" width="14" height="23" rx="3" fill="#F59E0B"/>
  <rect x="71" y="112" width="14" height="23" rx="3" fill="#EF5F18"/>
  <rect x="90" y="112" width="14" height="23" rx="3" fill="#261A66"/>
  <!-- Control Panel -->
  <rect x="118" y="34" width="18" height="28" rx="3" fill="#EF5F18"/>
  <circle cx="127" cy="74" r="3" fill="#FFFFFF"/>
  <circle cx="127" cy="84" r="3" fill="#FFFFFF"/>
  <circle cx="127" cy="94" r="3" fill="#FFFFFF"/>
  <rect x="120" y="106" width="14" height="20" rx="2" fill="#191047"/>
  <!-- Delivery Chute -->
  <rect x="44" y="154" width="68" height="26" rx="5" fill="#191047" stroke="#EF5F18" stroke-width="1.5"/>
  <rect x="54" y="162" width="48" height="10" rx="3" fill="#261A66"/>
  <!-- Feet -->
  <rect x="38" y="200" width="18" height="8" rx="3" fill="#191047"/>
  <rect x="124" y="200" width="18" height="8" rx="3" fill="#191047"/>
